[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-whisper-bridge"
version = "0.1.0"
description = "Loopback-only, OpenAI-style local Whisper transcription API"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "faster-whisper>=1.1,<2",
  "av>=11,<19",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
local-whisper-bridge = "local_whisper_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["local_whisper_bridge*"]

[tool.setuptools.package-data]
local_whisper_bridge = ["lab.html"]
